<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee7df"/>
      <stop offset="100%" stop-color="#b490ca"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6df5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 装饰圆 -->
  <circle cx="1150" cy="90" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="1230" cy="640" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="680" r="110" fill="#ffffff" opacity="0.07"/>
  <circle cx="640" cy="360" r="380" fill="#ffffff" opacity="0.03"/>

  <!-- 顶部：博客头像 + 站名 -->
  <g transform="translate(64, 52)">
    <circle cx="36" cy="36" r="36" fill="url(#avatarGrad)"/>
    <text x="36" y="50" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">吒</text>
    <text x="92" y="30" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff">小吒博客</text>
    <text x="92" y="56" font-family="'Cascadia Code', 'Consolas', ui-monospace, monospace" font-size="15" font-weight="500" fill="#ffffff" opacity="0.85">xiaozha.org</text>
  </g>

  <!-- 顶部装饰横线 -->
  <line x1="64" y1="168" x2="200" y2="168" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 标题 -->
  <g transform="translate(64, 250)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" filter="url(#cardShadow)">Mineradio 音乐播放器教程（2026）：</text>
    <text x="0" y="72" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" filter="url(#cardShadow)">3D 立体歌词开源播放器，支持网易云 Q</text>
    <text x="0" y="144" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" filter="url(#cardShadow)">Q 音乐同步</text>
  </g>

  <!-- 描述 -->
  <g transform="translate(64, 486)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#ffffff" opacity="0.88">Mineradio 是一款完全开源免费的音乐播放器，支持网易云和 QQ 音乐登录同步歌单，3D 立体歌</text>
    <text x="0" y="34" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#ffffff" opacity="0.88">词 + 动态视觉切换，听歌体验远超普通播放器。</text>
  </g>

  <!-- 底部：标签 -->
  <g transform="translate(64, 624)"><g transform="translate(0,0)"><rect width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="46" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#软件教程</text></g><g transform="translate(104,0)"><rect width="70" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="35" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#开源</text></g><g transform="translate(186,0)"><rect width="107" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="53.5" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#音乐播放器</text></g><g transform="translate(305,0)"><rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="52" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#Mineradio</text></g></g>

  <!-- 底部右侧：日期 + URL -->
  <text x="1216" y="640" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#ffffff" opacity="0.75">2026年7月29日</text>
  <text x="1216" y="666" text-anchor="end" font-family="'Cascadia Code', 'Consolas', ui-monospace, monospace" font-size="14" font-weight="500" fill="#ffffff" opacity="0.65">xiaozha.org</text>
</svg>