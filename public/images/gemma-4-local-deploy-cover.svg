<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6df5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 装饰圆 -->
  <circle cx="1150" cy="90" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="1230" cy="640" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="680" r="110" fill="#ffffff" opacity="0.07"/>
  <circle cx="640" cy="360" r="380" fill="#ffffff" opacity="0.03"/>

  <!-- 顶部：博客头像 + 站名 -->
  <g transform="translate(64, 52)">
    <circle cx="36" cy="36" r="36" fill="url(#avatarGrad)"/>
    <text x="36" y="50" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">吒</text>
    <text x="92" y="30" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff">小吒博客</text>
    <text x="92" y="56" font-family="'Cascadia Code', 'Consolas', ui-monospace, monospace" font-size="15" font-weight="500" fill="#ffffff" opacity="0.85">xiaozha.org</text>
  </g>

  <!-- 顶部装饰横线 -->
  <line x1="64" y1="168" x2="200" y2="168" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 标题 -->
  <g transform="translate(64, 250)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" filter="url(#cardShadow)">Gemma 4 本地部署完全指南：谷歌最新</text>
    <text x="0" y="72" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" filter="url(#cardShadow)">开源大模型，消费级显卡就能跑</text>
  </g>

  <!-- 描述 -->
  <g transform="translate(64, 414)">
    <text x="0" y="0" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#ffffff" opacity="0.88">Gemma 4 是谷歌 2026 年发布的最新开源大模型系列，包含 2B / 8B / 27B 三种规格。本文手把</text>
    <text x="0" y="34" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#ffffff" opacity="0.88">手教你在本地用 Ollama、vLLM 和 Transformers 三种方式部署 Gemma 4，并对比实际推理效…</text>
  </g>

  <!-- 底部：标签 -->
  <g transform="translate(64, 624)"><g transform="translate(0,0)"><rect width="70" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="35" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#&quot;AI&quot;</text></g><g transform="translate(82,0)"><rect width="93" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="46.5" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#&quot;大模型&quot;</text></g><g transform="translate(187,0)"><rect width="78" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#&quot;教程&quot;</text></g><g transform="translate(277,0)"><rect width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.16"/><text x="54" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">#&quot;免费工具&quot;</text></g></g>

  <!-- 底部右侧：日期 + URL -->
  <text x="1216" y="640" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#ffffff" opacity="0.75">2026年7月22日</text>
  <text x="1216" y="666" text-anchor="end" font-family="'Cascadia Code', 'Consolas', ui-monospace, monospace" font-size="14" font-weight="500" fill="#ffffff" opacity="0.65">xiaozha.org</text>
</svg>