<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="80" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="1140" cy="540" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="90" cy="560" r="90" fill="#ffffff" opacity="0.05"/>

  <!-- Grid subtle lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Logo circle + text -->
  <g filter="url(#shadow)">
    <circle cx="140" cy="140" r="70" fill="url(#logo)"/>
    <text x="140" y="165" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="56" font-weight="800" fill="#ffffff">吒</text>
  </g>

  <!-- Site name -->
  <text x="240" y="135" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="800" fill="#ffffff">小吒博客</text>
  <text x="240" y="180" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">xiaozha.org · 专注 AI 工具 · 云计算 · 自托管</text>

  <!-- Big tagline -->
  <text x="80" y="340" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="62" font-weight="800" fill="#ffffff">
    一个现代、极简、极速的个人技术博客
  </text>
  <text x="80" y="405" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="500" fill="#e2e8f0">
    Astro 构建 · Cloudflare Pages 部署 · 内容完全自主可控
  </text>

  <!-- Tags row -->
  <g transform="translate(80, 520)">
    <g>
      <rect width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="59" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">#AI 工具</text>
    </g>
    <g transform="translate(132, 0)">
      <rect width="156" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="78" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">#Cloudflare</text>
    </g>
    <g transform="translate(302, 0)">
      <rect width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="66" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">#自托管</text>
    </g>
    <g transform="translate(448, 0)">
      <rect width="124" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="62" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">#开源应用</text>
    </g>
    <g transform="translate(586, 0)">
      <rect width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="85" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">#59+ 篇原创</text>
    </g>
    <g transform="translate(770, 0)">
      <rect width="280" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="140" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff">#构建仅需 3 秒 · 零客户端 JS</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="80" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500" fill="#bae6fd">https://xiaozha.org</text>
  <text x="1120" y="602" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500" fill="#bae6fd">2026</text>
</svg>
