name: Deploy to Cloudflare Pages

on:
  # 部署走 Cloudflare Pages Git 集成（push 到 main 自动触发）
  # 此 workflow 仅作备选手动部署入口，需先配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID Secrets
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: blog
          directory: out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
